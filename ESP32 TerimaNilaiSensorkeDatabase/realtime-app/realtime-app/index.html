<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Perpustakaan</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f4f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .card {
        background: #fff;
        padding: 40px 60px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        text-align: center;
        transition: transform 0.2s;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .title {
        font-size: 24px;
        color: #333;
        margin-bottom: 20px;
      }

      .jumlah {
        font-size: 60px;
        font-weight: bold;
        color: #1e90ff;
        margin-bottom: 10px;
      }

      .footer {
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Jumlah Orang di ruangan</div>
      <div class="jumlah" id="jumlah">0</div>
    </div>

    <script>
      const API_URL = 'http://192.168.0.108:8000/api/sensors'; // endpoint Laravel

      async function fetchJumlah() {
        try {
          const res = await fetch('http://192.168.0.108:8000/api/sensors');
          const json = await res.json();

          // Ambil value dari json.data
          if (json.data && json.data.value !== undefined) {
            document.getElementById('jumlah').innerText = json.data.value;
          }
        } catch (err) {
          console.error('Error fetch jumlah:', err);
        }
      }

      // Fetch pertama kali
      fetchJumlah();

      // Update tiap 2 detik
      setInterval(fetchJumlah, 1000);
    </script>
  </body>
</html>
